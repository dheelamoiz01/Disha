name = "disha"
main = ".open-next/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Production retention cron (every 6 hours)
[triggers]
crons = ["0 */6 * * *"]

# ==============================================================================
# Domain & Storage Configuration Notice:
# Real domains must be confirmed before production deployment or merging to master.
# Existing production currently uses: https://disha-roan.vercel.app
# APK storage uses GitHub Releases (zero cost, unlimited CDN bandwidth, no credit card).
# ==============================================================================
[vars]
NEXT_PUBLIC_APP_URL = "https://<CONFIRMED_PRODUCTION_DOMAIN>"
ENVIRONMENT = "production"
GITHUB_REPO_OWNER = "dheelamoiz01"
GITHUB_REPO_NAME = "Disha"
GITHUB_RELEASE_TAG = "app-releases"

# ==============================================================================
# Isolated Staging Environment
# Deploy via: npx wrangler deploy --env staging
# ==============================================================================
[env.staging]
name = "disha-staging"

# Distinct staging runtime variables
[env.staging.vars]
NEXT_PUBLIC_APP_URL = "https://<CONFIRMED_STAGING_SUBDOMAIN>.workers.dev"
ENVIRONMENT = "staging"
GITHUB_REPO_OWNER = "dheelamoiz01"
GITHUB_REPO_NAME = "Disha"
GITHUB_RELEASE_TAG = "app-releases-staging"

# Retention purge cron explicitly disabled in staging until verified
[env.staging.triggers]
crons = []
