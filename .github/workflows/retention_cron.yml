name: DISHA 48-Hour Retention Hourly Cleanup

on:
  schedule:
    # Execute every hour at minute 0 UTC
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  hourly-retention-purge:
    name: Execute Location Purge
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Retention Purge Endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT_URL: https://disha-roan.vercel.app/api/admin/retention/purge
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "ERROR: CRON_SECRET GitHub Actions secret is not configured."
            exit 1
          fi

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "$ENDPOINT_URL")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS/d')

          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $BODY"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Purge execution failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "Retention purge executed successfully."
